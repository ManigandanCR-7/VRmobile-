<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Walkthrough with Joystick + GLB Model</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #joystick-zone {
        position: absolute;
        bottom: 70px;
        left: 130px; /* shifted slightly to the right */
        width: 150px;
        height: 150px;
        background: rgba(0, 0, 0, 0.1); /* blackish background */
        border-radius: 50%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="joystick-zone"></div>

    <a-scene>
      <!-- Camera Rig (for moving the player) -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>

      <!-- Load GLB model -->
      <a-entity 
        gltf-model="url(path/to/your-model.glb)" 
        position="0 0 -5" 
        scale="1 1 1">
      </a-entity>
    </a-scene>

    <script>
      const rig = document.querySelector("#rig");
      let moveX = 0, moveZ = 0;

      // Setup Joystick
      const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: 'black', // base color
        size: 120
      });

      // Add black outer + white middle look
      joystick.on('added', (evt, nipple) => {
        nipple.ui.front.style.background = "white"; // stick (inner)
        nipple.ui.back.style.background = "black";  // base (outer)
      });

      joystick.on('move', (evt, data) => {
        const angle = data.angle.radian;
        const force = data.force;
        moveX = Math.cos(angle) * force * 0.05;
        moveZ = -Math.sin(angle) * force * 0.05; // forward = forward
      });

      joystick.on('end', () => { moveX = 0; moveZ = 0; });

      // Movement loop
      function tick() {
        const pos = rig.getAttribute("position");
        rig.setAttribute("position", {
          x: pos.x + moveX,
          y: pos.y,
          z: pos.z + moveZ
        });
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
