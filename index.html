<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Walkthrough with Joystick</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }

      /* Outer Joystick Zone */
      #joystick-zone {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 160px;
        background: rgba(255, 255, 255, 0.3); /* semi-white */
        border: 3px solid pink;
        border-radius: 50%;
        touch-action: none;
      }

      /* Force the joystick knob to show */
      .nipple {
        background: pink !important;
        border: 2px solid white !important;
      }
      .nipple .front {
        background: pink !important;
        border: 2px solid white !important;
      }
    </style>
  </head>
  <body>
    <!-- Joystick Container -->
    <div id="joystick-zone"></div>

    <!-- A-Frame Scene -->
    <a-scene>
      <!-- Camera Rig -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera wasd-controls-enabled="false" look-controls="pointerLockEnabled: false"></a-camera>
      </a-entity>

      <!-- Ground & Sky -->
      <a-plane rotation="-90 0 0" width="50" height="50" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

      <!-- Objects -->
      <a-box position="0 1 -5" color="tomato"></a-box>
      <a-sphere position="2 1 -3" radius="1" color="blue"></a-sphere>
      <a-cylinder position="-2 1 -4" radius="0.5" height="2" color="orange"></a-cylinder>
    </a-scene>

    <script>
      const rig = document.querySelector("#rig");
      const camera = document.querySelector("a-camera");
      let moveForward = 0, moveSide = 0;

      // Setup Joystick (static + always visible)
      const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: 'pink',
        size: 120,
        restJoystick: true   // keeps joystick knob visible always
      });

      // Force render the joystick knob immediately
      setTimeout(() => {
        joystick.trigger('added'); 
      }, 100);

      // Joystick Move Event
      joystick.on('move', (evt, data) => {
        const rad = data.angle.radian;
        const force = data.force;

        moveForward = Math.cos(rad) * force * 0.05;
        moveSide = Math.sin(rad) * force * 0.05;
      });

      // Joystick Release Event
      joystick.on('end', () => { moveForward = 0; moveSide = 0; });

      // Movement Loop
      function tick() {
        const pos = rig.getAttribute("position");
        const rotation = camera.object3D.rotation.y; // yaw

        // Rotate joystick vector by camera yaw
        const dx = moveSide * Math.cos(rotation) - moveForward * Math.sin(rotation);
        const dz = moveSide * Math.sin(rotation) + moveForward * Math.cos(rotation);

        rig.setAttribute("position", {
          x: pos.x + dx,
          y: pos.y,
          z: pos.z - dz
        });

        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
