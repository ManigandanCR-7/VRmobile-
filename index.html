<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Walkthrough with Joystick + GLB Model</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #joystick-zone {
        position: absolute;
        bottom: 70px;
        left: 130px;
        width: 150px;
        height: 150px;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="joystick-zone"></div>

    <a-scene>
      <!-- Camera Rig (starting slightly forward) -->
      <a-entity id="rig" position="19 1.6 -2">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>

      <!-- Load GLB model -->
      <a-entity 
        gltf-model="url(vr_gallery_house_baked.gltf)" 
        position="0 0 -5" 
        scale="1 1 1">
      </a-entity>
    </a-scene>

    <script>
      const rig = document.querySelector("#rig");
      const camera = rig.querySelector("a-camera");

      let moveX = 0, moveZ = 0;

      // Setup Joystick
      const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: 'black',
        size: 120
      });

      joystick.on('added', (evt, nipple) => {
        nipple.ui.front.style.background = "white"; // stick (inner)
        nipple.ui.back.style.background = "black";  // base (outer)
      });

      joystick.on('move', (evt, data) => {
        const angle = data.angle.radian;
        const force = data.force;
        moveX = Math.cos(angle) * force * 0.05;
        moveZ = -Math.sin(angle) * force * 0.05; // forward = forward
      });

      joystick.on('end', () => { moveX = 0; moveZ = 0; });

      // Define rigid boundaries (adjust as needed)
      const minX = -10, maxX = 10;
      const minZ = -15, maxZ = 5;

      // Movement loop
      function tick() {
        const pos = rig.getAttribute("position");

        // Get camera facing direction
        const direction = new THREE.Vector3();
        camera.object3D.getWorldDirection(direction);

        // Apply joystick relative to camera
        const dx = direction.x * moveZ + direction.z * moveX;
        const dz = direction.z * moveZ - direction.x * moveX;

        // New tentative position
        let newX = pos.x + dx;
        let newZ = pos.z + dz;

        // Clamp inside rigid bounds
        newX = Math.max(minX, Math.min(maxX, newX));
        newZ = Math.max(minZ, Math.min(maxZ, newZ));

        rig.setAttribute("position", {
          x: newX,
          y: pos.y,
          z: newZ
        });

        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
