  <!-- ===================================================
       PWA + OVERLAY SCRIPT
  =================================================== -->

  <script>


    /* =================================================
       SERVICE WORKER
    ================================================= */

    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        () => {

          navigator.serviceWorker
            .register('/sw.js')

            .then(
              reg => {

                console.log(
                  '✅ Service Worker registered:',
                  reg
                );

              }
            )

            .catch(
              err => {

                console.error(
                  '❌ Service Worker failed:',
                  err
                );

              }
            );

        }
      );

    }


    /* =================================================
       EXISTING REFERENCES
    ================================================= */

    const installBtn =
      document.getElementById(
        "install-btn"
      );

    const overlay =
      document.getElementById(
        "overlay"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const countdownEl =
      document.getElementById(
        "countdown"
      );


    let deferredPrompt;



    /* =================================================
       LOADING SCREEN
    ================================================= */

    function startLoadingScreen() {

      if (!loading || !countdownEl) {
        return;
      }

      loading.style.display =
        "flex";

      let count = 5;

      countdownEl.textContent =
        count;


      const interval =
        setInterval(
          () => {

            count--;

            countdownEl.textContent =
              count;


            if (count <= 0) {

              clearInterval(
                interval
              );

              loading.style.display =
                "none";

            }

          },
          1000
        );

    }



    /* =================================================
       HIDE OVERLAY
    ================================================= */

    function hideOverlayAndRemember() {

      if (overlay) {

        overlay.style.display =
          "none";

      }


      try {

        localStorage.setItem(
          'pwa_installed',
          'true'
        );

      }

      catch(e) {}


      startLoadingScreen();

    }



    /* =================================================
       PWA INSTALL
    ================================================= */

    window.addEventListener(
      'beforeinstallprompt',
      e => {

        e.preventDefault();

        deferredPrompt = e;

        console.log(
          "📲 PWA install available"
        );

      }
    );



    if (installBtn) {

      installBtn.addEventListener(
        "click",
        async () => {

          if (deferredPrompt) {

            deferredPrompt.prompt();

            const choice =
              await deferredPrompt
                .userChoice;


            if (
              choice.outcome ===
              "accepted"
            ) {

              console.log(
                "✅ User installed app"
              );

              hideOverlayAndRemember();

            }

            else {

              console.log(
                "❌ User dismissed install"
              );

            }


            deferredPrompt = null;

          }

          else {

            alert(
              "If you see an option in your browser menu like 'Install app' or 'Add to Home screen', use that."
            );

          }

        }
      );

    }



    /* =================================================
       APP INSTALLED
    ================================================= */

    window.addEventListener(
      'appinstalled',
      () => {

        console.log(
          '📥 PWA installed'
        );

        hideOverlayAndRemember();

      }
    );



    /* =================================================
       STANDALONE
    ================================================= */

    window.addEventListener(
      'load',
      () => {

        const isStandalone =
          window.matchMedia(
            '(display-mode: standalone)'
          ).matches
          ||
          window.navigator.standalone === true;


        const remembered =
          localStorage.getItem(
            'pwa_installed'
          ) === 'true';


        if (
          isStandalone ||
          remembered
        ) {

          hideOverlayAndRemember();

        }

      }
    );

  </script>



  <!-- ===================================================
       JOYSTICK + MOVEMENT
  =================================================== -->

  <script>


    const rig =
      document.querySelector(
        "#rig"
      );


    const camera =
      rig.querySelector(
        "a-camera"
      );


    const music =
      document.querySelector(
        "#bg-music"
      );


    rig.setAttribute(
      "position",
      {
        x: 10,
        y: 1.6,
        z: -14
      }
    );


    let moveX = 0;

    let moveZ = 0;

    let musicPlaying = false;



    /* =================================================
       JOYSTICK
    ================================================= */

    const joystick =
      nipplejs.create({

        zone:
          document.getElementById(
            'joystick-zone'
          ),

        mode:
          'static',

        position: {
          left: '50%',
          top: '50%'
        },

        color:
          '#d9d9d9',

        size:
          120

      });



    /* =================================================
       JOYSTICK STYLE
    ================================================= */

    joystick.on(
      'added',
      (evt,nipple) => {


        nipple.ui.back.style.background =
          "#d9d9d9";


        nipple.ui.back.style.boxShadow =
          "0 0 12px rgba(0,0,0,0.25)";


        nipple.ui.front.style.background =
          "#f5f5f5";


        nipple.ui.front.style.boxShadow = `

          0 4px 8px
          rgba(0,0,0,0.3),

          inset 0 2px 4px
          rgba(255,255,255,0.6)

        `;


        nipple.ui.front.style.border =
          "1px solid #ccc";

      }
    );



    /* =================================================
       JOYSTICK MOVEMENT
    ================================================= */

    joystick.on(
      'move',
      (evt,data) => {


        if (!musicPlaying) {

          music.components.sound
            .playSound();

          musicPlaying = true;

        }


        const angle =
          data.angle.radian;


        const force =
          data.force;


        moveX =
          Math.cos(angle)
          *
          force
          *
          0.05;


        moveZ =
          -Math.sin(angle)
          *
          force
          *
          0.05;

      }
    );



    joystick.on(
      'end',
      () => {

        moveX = 0;

        moveZ = 0;

      }
    );



    /* =================================================
       MOVEMENT LIMITS
    ================================================= */

    const minX = -5;

    const maxX = 5;

    const minZ = -9;

    const maxZ = -1;



    /* =================================================
       MOVEMENT LOOP
    ================================================= */

    function tick() {


      const pos =
        rig.getAttribute(
          "position"
        );


      const direction =
        new THREE.Vector3();


      camera.object3D
        .getWorldDirection(
          direction
        );


      const dx =
        direction.x *
        moveZ
        +
        direction.z *
        moveX;


      const dz =
        direction.z *
        moveZ
        -
        direction.x *
        moveX;


      let newX =
        pos.x + dx;


      let newZ =
        pos.z + dz;


      newX =
        Math.max(
          minX,
          Math.min(
            maxX,
            newX
          )
        );


      newZ =
        Math.max(
          minZ,
          Math.min(
            maxZ,
            newZ
          )
        );


      rig.setAttribute(
        "position",
        {
          x: newX,
          y: pos.y,
          z: newZ
        }
      );


      requestAnimationFrame(
        tick
      );

    }


    tick();

  </script>



  <!-- ===================================================
       INTRO COUNTDOWN
  =================================================== -->

  <script>


    window.addEventListener(
      "load",
      () => {


        const intro =
          document.getElementById(
            "intro-overlay"
          );


        const countdownText =
          document.getElementById(
            "countdown-text"
          );


        let timeLeft = 10;


        const countdown =
          setInterval(
            () => {


              timeLeft--;


              countdownText.textContent =
                timeLeft;


              if (
                timeLeft <= 0
              ) {


                clearInterval(
                  countdown
                );


                intro.style.opacity =
                  "0";


                setTimeout(
                  () => {

                    intro.style.display =
                      "none";

                  },
                  1000
                );

              }

            },
            1000
          );

      }
    );

  </script>



  <!-- ===================================================
       3D TV INTERACTION
  =================================================== -->

  <script>


    const tvInteraction =
      document.getElementById(
        "tv-interaction"
      );


    const youtubePanel =
      document.getElementById(
        "youtube-interaction"
      );


    const youtubeClose =
      document.getElementById(
        "youtube-close"
      );


    /* =================================================
       CLICK TV
    ================================================= */

    tvInteraction.addEventListener(
      "click",
      () => {

        youtubePanel.style.display =
          "block";

      }
    );


    /* =================================================
       CLOSE YOUTUBE
    ================================================= */

    youtubeClose.addEventListener(
      "click",
      () => {

        youtubePanel.style.display =
          "none";

      }
    );

  </script>



  <!-- ===================================================
       DISABLE INSPECT / RIGHT CLICK
  =================================================== -->

  <script>


    /* =================================================
       RIGHT CLICK
    ================================================= */

    document.addEventListener(
      'contextmenu',
      function(e) {

        e.preventDefault();

      }
    );



    /* =================================================
       KEYBOARD
    ================================================= */

    document.addEventListener(
      'keydown',
      function(e) {


        /* F12 */

        if (
          e.keyCode === 123
        ) {

          e.preventDefault();

        }


        /* Ctrl + Shift + I */

        if (
          e.ctrlKey &&
          e.shiftKey &&
          e.keyCode === 73
        ) {

          e.preventDefault();

        }


        /* Ctrl + Shift + C */

        if (
          e.ctrlKey &&
          e.shiftKey &&
          e.keyCode === 67
        ) {

          e.preventDefault();

        }


        /* Ctrl + U */

        if (
          e.ctrlKey &&
          e.keyCode === 85
        ) {

          e.preventDefault();

        }


        /* Ctrl + Shift + J */

        if (
          e.ctrlKey &&
          e.shiftKey &&
          e.keyCode === 74
        ) {

          e.preventDefault();

        }

      }
    );



    /* =================================================
       TEXT SELECTION
    ================================================= */

    document.addEventListener(
      'selectstart',
      e => e.preventDefault()
    );



    /* =================================================
       COPY
    ================================================= */

    document.addEventListener(
      'copy',
      e => e.preventDefault()
    );



    /* =================================================
       DEVTOOLS DETECTION
    ================================================= */

    (function() {


      let checkDevTools =
        function() {


          const threshold =
            160;


          if (

            window.outerHeight -
            window.innerHeight >
            threshold

            ||

            window.outerWidth -
            window.innerWidth >
            threshold

          ) {


            document.body.innerHTML =
              "";


            alert(
              "Developer Tools is disabled on this webpage."
            );


            window.close();

          }

        };


      setInterval(
        checkDevTools,
        1000
      );


    })();

  </script>
