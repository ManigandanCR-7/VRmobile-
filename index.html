<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Walkthrough with Joystick</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }

      /* Always visible joystick zone */
      #joystick-zone {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 160px;
        background: rgba(255, 255, 255, 0.3); /* semi-white */
        border: 3px solid pink;
        border-radius: 50%;
        touch-action: none;
      }

      /* Joystick knob style */
      .nipple {
        background: pink !important;
        border: 2px solid white !important;
      }
      .nipple .front {
        background: pink !important;
        border: 2px solid white !important;
      }
    </style>
  </head>
  <body>
    <!-- Joystick Controller -->
    <div id="joystick-zone"></div>

    <!-- A-Frame Scene -->
    <a-scene>
      <!-- Camera Rig -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera wasd-controls-enabled="false" look-controls="pointerLockEnabled: false"></a-camera>
      </a-entity>

      <!-- Ground & Sky -->
      <a-plane rotation="-90 0 0" width="50" height="50" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

      <!-- Objects -->
      <a-box position="0 1 -5" color="tomato"></a-box>
      <a-sphere position="2 1 -3" radius="1" color="blue"></a-sphere>
      <a-cylinder position="-2 1 -4" radius="0.5" height="2" color="orange"></a-cylinder>
    </a-scene>

    <script>
      const rig = document.querySelector("#rig");
      const camera = document.querySelector("a-camera");
      let moveX = 0, moveZ = 0;

      // Setup Joystick (always visible)
      const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: 'pink',
        size: 120,
        restJoystick: true
      });

      // Joystick Move Event
      joystick.on('move', (evt, data) => {
        const angle = data.angle.radian;
        const force = data.force;

        // Camera yaw for relative movement
        const yaw = camera.object3D.rotation.y;

        // Convert joystick movement into world direction
        moveX = (Math.cos(angle) * Math.cos(yaw) - Math.sin(angle) * Math.sin(yaw)) * force * 0.05;
        moveZ = (Math.cos(angle) * Math.sin(yaw) + Math.sin(angle) * Math.cos(yaw)) * force * 0.05;
      });

      // Stop movement when joystick released
      joystick.on('end', () => { moveX = 0; moveZ = 0; });

      // Movement loop
      function tick() {
        const pos = rig.getAttribute("position");
        rig.setAttribute("position", {
          x: pos.x + moveX,
          y: pos.y,
          z: pos.z - moveZ   // minus keeps forward natural
        });
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
