<!DOCTYPE html>
<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta charset="utf-8" />
    <title>VR Walkthrough with Joystick + GLB Model + Music</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

      /* Overlay styles */
      #overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.3); 
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        text-align: center;
      }
      #overlay h1 {
        font-size: 24px;
        margin-bottom: 20px;
      }
      #install-btn {
        background: #00cc66;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
      }
      #install-btn:hover {
        background: #00994d;
      }

      #joystick-zone {
        position: absolute;
        bottom: 70px;
        left: 130px;
        width: 150px;
        height: 150px;
        background: rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        touch-action: none;
      } 
      #loading {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9998;
        color: white;
        font-size: 48px;
        font-weight: bold;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <!-- Overlay -->
    
    <!-- Joystick -->
    <div id="joystick-zone"></div>

    <!-- A-Frame Scene -->
    <a-scene>
      <!-- Camera Rig -->
      <a-entity id="rig" position="10 1.6 -14">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>

      <!-- Load GLB model -->
      <a-entity 
        gltf-model="url(vr_gallery_house_baked.gltf)" 
        position="0 0 -5" 
        scale="1 1 1">
      </a-entity>

      <!-- Background Music -->
      <a-entity id="bg-music" 
        sound="src: url(good-night-lofi-cozy-chill-music-160166.mp3); autoplay: false; loop: true; volume: 0.7">
      </a-entity>
    </a-scene>

    <!-- PWA + Overlay Script -->
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Service Worker registered:', reg))
            .catch(err => console.error('❌ Service Worker failed:', err));
        });
      }

      const installBtn = document.getElementById("install-btn");
      const overlay = document.getElementById("overlay");
      const loading = document.getElementById("loading");
      const countdownEl = document.getElementById("countdown");

      let deferredPrompt;

      function startLoadingScreen() {
        loading.style.display = "flex";
        let count = 5;
        countdownEl.textContent = count;
        const interval = setInterval(() => {
          count--;
          countdownEl.textContent = count;
          if (count <= 0) {
            clearInterval(interval);
            loading.style.display = "none";
          }
        }, 1000);
      }

      function hideOverlayAndRemember() {
        overlay.style.display = "none";
        try { localStorage.setItem('pwa_installed', 'true'); } catch (e) {}
        startLoadingScreen();
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log("📲 PWA install available");
      });

      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if (choice.outcome === "accepted") {
            console.log("✅ User installed app");
            hideOverlayAndRemember();
          } else {
            console.log("❌ User dismissed install");
          }
          deferredPrompt = null;
        } else {
          alert("If you see an option in your browser menu like 'Install app' or 'Add to Home screen', use that.");
        }
      });

      window.addEventListener('appinstalled', () => {
        console.log('📥 PWA installed');
        hideOverlayAndRemember();
      });

      window.addEventListener('load', () => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                           || window.navigator.standalone === true; // iOS
        const remembered = localStorage.getItem('pwa_installed') === 'true';
        if (isStandalone || remembered) {
          hideOverlayAndRemember();
        }
      });
    </script> 

    <!-- Joystick + Movement Script -->
    <script>
      const rig = document.querySelector("#rig");
      const camera = rig.querySelector("a-camera");
      const music = document.querySelector("#bg-music");

      rig.setAttribute("position", { x: 10, y: 1.6, z: -14 });

      let moveX = 0, moveZ = 0;
      let musicPlaying = false;

      const joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: 'black',
        size: 120
      });

      joystick.on('added', (evt, nipple) => {
        nipple.ui.front.style.background = "white";
        nipple.ui.back.style.background = "black";
      });

      joystick.on('move', (evt, data) => {
        if (!musicPlaying) {
          music.components.sound.playSound();
          musicPlaying = true;
        }
        const angle = data.angle.radian;
        const force = data.force;
        moveX = Math.cos(angle) * force * 0.05;
        moveZ = -Math.sin(angle) * force * 0.05;
      });

      joystick.on('end', () => { moveX = 0; moveZ = 0; });

      const minX = -5, maxX = 5;
      const minZ = -9, maxZ = -1;

      function tick() {
        const pos = rig.getAttribute("position");
        const direction = new THREE.Vector3();
        camera.object3D.getWorldDirection(direction);

        const dx = direction.x * moveZ + direction.z * moveX;
        const dz = direction.z * moveZ - direction.x * moveX;

        let newX = pos.x + dx;
        let newZ = pos.z + dz;

        newX = Math.max(minX, Math.min(maxX, newX));
        newZ = Math.max(minZ, Math.min(maxZ, newZ));

        rig.setAttribute("position", { x: newX, y: pos.y, z: newZ });

        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
